[project]
name = "fe-agent"
version = "0.1.0"
description = "Frontend Engineering Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autopep8>=2.3.2",
    "black>=26.5.1",
    "openai",
    "pydantic",
    "pylint>=4.0.8",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]

[tool.black]
target-version = ['py313']

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
